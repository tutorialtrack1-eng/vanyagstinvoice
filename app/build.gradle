plugins { id 'com.android.application' }

android {
    namespace 'com.vanyaliving.invoice'
    compileSdk 35

    defaultConfig {
        applicationId 'com.vanyaliving.invoice'
        minSdk 29
        targetSdk 35
        // Bump both (and webportal/app-version.json) whenever a new APK is published: the app compares versionCode
        versionCode 15
        versionName '1.14'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
}
